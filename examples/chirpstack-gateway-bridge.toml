# The bridge behind the gate: plain ws, no TLS and no CA of its own. Only the
# gate can reach it (the `internal` network in compose.yaml).
[backend]
type = "basic_station"

  [backend.basic_station]
  bind = "0.0.0.0:3001"
  region = "EU868"
  frequency_min = 863000000
  frequency_max = 870000000

  # One SX1301 with the EU868 channel plan. Without a concentrator the bridge
  # sends hwspec sx1301/0, and the station refuses the whole router_config.
  [[backend.basic_station.concentrators]]
    [backend.basic_station.concentrators.multi_sf]
    frequencies = [868100000, 868300000, 868500000, 867100000, 867300000, 867500000, 867700000, 867900000]

    [backend.basic_station.concentrators.lora_std]
    frequency = 868300000
    bandwidth = 250000
    spreading_factor = 7

    [backend.basic_station.concentrators.fsk]
    frequency = 868800000

[integration.mqtt.auth.generic]
servers = ["tcp://mosquitto:1883"]

[integration]
marshaler = "json"
